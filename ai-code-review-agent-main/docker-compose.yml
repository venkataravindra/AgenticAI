# Orchestrates all four services as one stack — used both for local
# Docker testing and as the deployment manifest run on EC2.
#
# Two layers of config, on purpose:
#   - Secrets (API keys) come from each service's own .env via env_file —
#     never baked into an image, never committed.
#   - Container topology (service hostnames, container-internal paths)
#     is set here via `environment:`, which overrides matching keys from
#     env_file. On Docker's internal network, services reach each other
#     by service name (e.g. http://mcp-server:8002), not localhost.
#
# Only 22 (SSH), 80 (frontend), 8000 (backend API) and 8080 (Jenkins) are
# opened in the EC2 security group — publishing 8001/8002 here is just for
# local debugging (curl-ing them directly from the host).

services:
  config-server:
    build: ./config-server
    image: ${DOCKERHUB_USERNAME:-local}/code-review-config-server:${TAG:-latest}
    env_file:
      - ./config-server/.env
    environment:
      MCP_SERVER_URL: http://mcp-server:8002
      CHROMA_DB_PATH: chroma_db
    ports:
      - "8001:8001"
    restart: unless-stopped

  mcp-server:
    build: ./mcp-server
    image: ${DOCKERHUB_USERNAME:-local}/code-review-mcp-server:${TAG:-latest}
    env_file:
      - ./mcp-server/.env
    ports:
      - "8002:8002"
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/code-review-backend:${TAG:-latest}
    env_file:
      - ./backend/.env
    environment:
      CONFIG_SERVER_URL: http://config-server:8001
      MCP_SERVER_URL: http://mcp-server:8002
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      - config-server
      - mcp-server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    image: ${DOCKERHUB_USERNAME:-local}/code-review-frontend:${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_chroma:
